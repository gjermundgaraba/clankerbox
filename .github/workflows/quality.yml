name: Quality
# A pull request's branch runs once, as the pull request; pushes run on main. The release calls
# it first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  ready:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm ready
      - name: Pack, install and run the CLI
        run: |
          pnpm --filter @gjermundgaraba/clankerbox pack --pack-destination "$RUNNER_TEMP/cli"
          tar -tzf "$RUNNER_TEMP/cli/"*.tgz | grep -qx package/LICENSE
          npm install --global --prefix "$RUNNER_TEMP/cli-prefix" --ignore-scripts "$RUNNER_TEMP/cli/"*.tgz
          bin="$RUNNER_TEMP/cli-prefix/bin/clankerbox"
          test "$("$bin" --version)" = "clankerbox v$(jq -r .version apps/clankerbox/package.json)"
          "$bin" --help | grep -qF "clankerbox <subcommand> [flags]"
          "$bin" host --help | grep -qF -- "--config"
          if "$bin" host >/dev/null 2>&1; then exit 1; fi
