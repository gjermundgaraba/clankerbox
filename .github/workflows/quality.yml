name: Quality
# A pull request's branch runs once, as the pull request; pushes run on main and release tags.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
permissions:
  contents: read
jobs:
  ready:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm ready
  sea:
    strategy:
      matrix:
        include:
          - runner: macos-15 # arm64
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/release/cache
          key: sea-node-${{ matrix.target }}-${{ hashFiles('.node-version', 'tools/release/release-inputs.json') }}
      - run: pnpm sea:build ${{ matrix.target }}
      - run: pnpm sea:smoke "tools/release/dist/clankerbox-$(node -p "require('./packages/contract/package.json').version")-${{ matrix.target }}.tar.gz"
