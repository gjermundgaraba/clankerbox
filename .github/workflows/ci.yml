name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Restore each test file's last duration, which vitest reads only to start the longest first
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/*/node_modules/.vite/vitest
            packages/*/node_modules/.vite/vitest
            tools/*/node_modules/.vite/vitest
          key: vitest-results-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vitest-results-
      - name: Check that no doc still cites a name this change removed
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD^' }}
        run: node .github/stale-doc-names.ts "$BASE"
      - name: Install the guest shells the host's tests run the launcher under
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh busybox-static
      - run: vp run ready
      - name: Check that the build left the tree clean
        run: git diff --exit-code
      - name: Pack, install and run each program
        run: |
          for app in cli server host; do
            package=$(jq -r .name "apps/$app/package.json")
            program=$(jq -r '.bin | keys[0]' "apps/$app/package.json")
            vp exec pnpm --filter "$package" pack --pack-destination "$RUNNER_TEMP/$app"
            tar -tzf "$RUNNER_TEMP/$app/"*.tgz | grep -qx package/LICENSE
            npm install --global --prefix "$RUNNER_TEMP/$app-prefix" --ignore-scripts "$RUNNER_TEMP/$app/"*.tgz
            bin="$RUNNER_TEMP/$app-prefix/bin/$program"
            test "$("$bin" --version)" = "$program v$(jq -r .version "apps/$app/package.json")"
          done
          "$RUNNER_TEMP/cli-prefix/bin/clankerbox" --help | grep -qF "clankerbox <subcommand> [flags]"
          for program in server/clankerbox-server host/clankerbox-host; do
            bin="$RUNNER_TEMP/${program%/*}-prefix/bin/${program#*/}"
            "$bin" --help | grep -qF -- "--config"
            if "$bin" >/dev/null 2>&1; then exit 1; fi
          done
      - name: Stop the installed host with an exec running
        working-directory: apps/host
        run: CLANKERBOX_HOST_PROGRAM="$RUNNER_TEMP/host-prefix/bin/clankerbox-host" vp test run tests/program.test.ts

  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that each Action is pinned to the commit its version comment names
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: "false"
          verify: "true"
      - name: Check that every engines.node names the Node version in .node-version
        run: |
          want=">=$(cat .node-version)"
          status=0
          for file in $(git ls-files package.json '*/package.json'); do
            engines=$(jq -r '.engines.node // empty' "$file")
            [[ -z "$engines" || "$engines" == "$want" ]] || { echo "::error file=$file::engines.node $engines is not $want"; status=1; }
          done
          exit "$status"

  weakenings:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Install the guest shells the host's tests run the launcher under
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh busybox-static
      - name: Plant each weakening the auth guards must refuse, and check its test refuses it
        run: node packages/sdk/tests/weakenings.ts .

  smolvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SMOLVM_VERSION: 1.34.1
      SMOLVM_PREFIX: /srv/smolvm/1.34.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Install smolvm to a prefix that carries no POSIX ACL
        # The runner's /opt holds a default ACL, which smolvm's guest kernel can't copy up (#116),
        # so the prefix lies under /srv, and is checked after the install: getfacl -s lists only
        # files that carry an ACL.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zstd acl
          curl -fsSL "https://raw.githubusercontent.com/smol-machines/smolvm/v$SMOLVM_VERSION/scripts/install.sh" -o "$RUNNER_TEMP/install.sh"
          echo "e68d588c9175e663d16e901ae1d896c93efcff88d2d810de143f05b15a846cc5  $RUNNER_TEMP/install.sh" | sha256sum -c -
          sudo mkdir -p "$SMOLVM_PREFIX"
          sudo HOME="$SMOLVM_PREFIX" bash "$RUNNER_TEMP/install.sh" --version "$SMOLVM_VERSION" --prefix "$SMOLVM_PREFIX" --no-modify-path
          for t in storage-template.ext4 overlay-template.ext4; do
            sudo zstd -q -d --sparse "$SMOLVM_PREFIX/$t.zst" -o "$SMOLVM_PREFIX/$t"
          done
          acls=$(sudo getfacl -Rsp "$SMOLVM_PREFIX" | grep '^# file:' || true)
          if [ -n "$acls" ]; then
            echo "::error::$SMOLVM_PREFIX carries POSIX ACLs, which break every smolvm fork and stopped capture; strip them with setfacl -bR:"
            echo "$acls"
            exit 1
          fi
          printf '[Slice]\nMemoryMax=97%%\n' | sudo tee /etc/systemd/system/smolvm.slice >/dev/null
          sudo systemctl daemon-reload
      - run: vp run build
      - name: Run the smolvm runtime's live suite as root, as a smolvm host runs
        working-directory: apps/host
        run: >-
          sudo env "PATH=$PATH" "SMOLVM_PREFIX=$SMOLVM_PREFIX" CLANKERBOX_LIVE=1 vp test run tests/live/smolvm.test.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/smolvm.json"
      - name: Check that the suite ran its test and skipped none
        run: jq -e '[.testResults[].assertionResults[]] | length > 0 and all(.status == "passed")' "$RUNNER_TEMP/smolvm.json"
      - name: Stop a machine with --capture through the host, control plane and CLI, and restore it
        run: bash .github/smolvm-stop-capture.sh "$SMOLVM_PREFIX"

  kind-shard:
    name: kind (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Install kind
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/kind" | sha256sum -c -
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: Run this shard of the agent-sandbox runtime's files against a kind cluster
        working-directory: apps/host
        run: >-
          vp run test:kind --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/kind-${{ matrix.shard }}.json"
      - name: Check that the shard ran tests and skipped none
        run: jq -e '[.testResults[].assertionResults[]] | length > 0 and all(.status == "passed")' "$RUNNER_TEMP/kind-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-${{ matrix.shard }}
          path: ${{ runner.temp }}/kind-${{ matrix.shard }}.json
          if-no-files-found: error

  kind:
    needs: kind-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check that every shard passed
        run: test "${{ needs.kind-shard.result }}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          run-install: false
      - run: vp install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kind-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: Check that the shards together passed every kind test, and every part of the contract is a file
        working-directory: apps/host
        run: |
          set -o pipefail
          vp test run tests/kind --reporter=json --outputFile.json="$RUNNER_TEMP/all.json"
          jq -r '.testResults[] | (.name | sub(".*/apps/host/"; "")) as $file | .assertionResults[] | "\($file) > \(.fullName)"' \
            "$RUNNER_TEMP/all.json" | sort >"$RUNNER_TEMP/all.txt"
          jq -r '.testResults[] | (.name | sub(".*/apps/host/"; "")) as $file | .assertionResults[] | select(.status == "passed") | "\($file) > \(.fullName)"' \
            "$RUNNER_TEMP"/shards/*.json | sort >"$RUNNER_TEMP/passed.txt"
          diff "$RUNNER_TEMP/all.txt" "$RUNNER_TEMP/passed.txt"
          parts=$(grep -oE 'part [0-9]+ of [0-9]+' "$RUNNER_TEMP/all.txt" | sort -u)
          of=$(awk '{print $4}' <<<"$parts" | sort -u)
          [[ $of =~ ^[1-9][0-9]*$ ]]
          test "$parts" = "$(for i in $(seq "$of"); do echo "part $i of $of"; done | sort)"
