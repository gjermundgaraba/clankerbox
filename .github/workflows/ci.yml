name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run ready
      - name: Pack, install and run the CLI
        run: |
          vp exec pnpm --filter @gjermundgaraba/clankerbox pack --pack-destination "$RUNNER_TEMP/cli"
          tar -tzf "$RUNNER_TEMP/cli/"*.tgz | grep -qx package/LICENSE
          npm install --global --prefix "$RUNNER_TEMP/cli-prefix" --ignore-scripts "$RUNNER_TEMP/cli/"*.tgz
          bin="$RUNNER_TEMP/cli-prefix/bin/clankerbox"
          test "$("$bin" --version)" = "clankerbox v$(jq -r .version apps/clankerbox/package.json)"
          "$bin" --help | grep -qF "clankerbox <subcommand> [flags]"
          "$bin" host --help | grep -qF -- "--config"
          if "$bin" host >/dev/null 2>&1; then exit 1; fi
