name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          cache-toolchain: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run ready
      - name: Check that the build left the tree clean
        run: git diff --exit-code
      - name: Pack, install and run each program
        run: |
          for app in cli server host; do
            package=$(jq -r .name "apps/$app/package.json")
            program=$(jq -r '.bin | keys[0]' "apps/$app/package.json")
            vp exec pnpm --filter "$package" pack --pack-destination "$RUNNER_TEMP/$app"
            tar -tzf "$RUNNER_TEMP/$app/"*.tgz | grep -qx package/LICENSE
            npm install --global --prefix "$RUNNER_TEMP/$app-prefix" --ignore-scripts "$RUNNER_TEMP/$app/"*.tgz
            bin="$RUNNER_TEMP/$app-prefix/bin/$program"
            test "$("$bin" --version)" = "$program v$(jq -r .version "apps/$app/package.json")"
          done
          "$RUNNER_TEMP/cli-prefix/bin/clankerbox" --help | grep -qF "clankerbox <subcommand> [flags]"
          for program in server/clankerbox-server host/clankerbox-host; do
            bin="$RUNNER_TEMP/${program%/*}-prefix/bin/${program#*/}"
            "$bin" --help | grep -qF -- "--config"
            if "$bin" >/dev/null 2>&1; then exit 1; fi
          done
      - name: Stop the installed host with an exec running
        working-directory: apps/host
        run: CLANKERBOX_HOST_PROGRAM="$RUNNER_TEMP/host-prefix/bin/clankerbox-host" vp test run tests/program.test.ts
