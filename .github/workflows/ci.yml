name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Go tests run on macOS only until internal/guest/session passes on Linux.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
