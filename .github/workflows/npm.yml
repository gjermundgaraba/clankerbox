name: npm
on:
  push:
    tags: ["v*"]
  # A manual run builds and packs every package without publishing, to try a change to this job before a tag.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Check that the published packages share one version, the tag's on a tag
        run: |
          versions=$(vp exec pnpm ls -r --depth -1 --json | jq -r '[.[] | select(.private | not) | .version] | unique | join(" ")')
          echo "versions: $versions"
          [[ "$versions" =~ ^[^\ ]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test "$versions" = "${GITHUB_REF_NAME#v}"; fi
      - run: vp run build
      # --force packs each package even when npm already has its version, which a plain -r skips.
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: vp pm publish -r --dry-run --force --no-git-checks
      - if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: vp pm publish -r --no-git-checks
