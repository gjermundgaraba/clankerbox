name: Release
# Release tags only, vX.Y.Z, naming the SDK's version, which the binaries share: runs Quality,
# whose sea job builds, bundles and smokes both targets, uploads every bundle and its .sha256
# to the tag's GitHub release, then publishes the SDK to npm. The npm trusted publisher is
# bound to this file's name.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions: {}
concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag names the SDK's version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version packages/contract/package.json)"
  quality:
    needs: tag
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
  release:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true
      - name: Upload the bundles to the tag's GitHub release
        working-directory: bundles
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for target in darwin-arm64 linux-x64; do
            test -s "clankerbox-${TAG#v}-$target.tar.gz"
            test -s "clankerbox-${TAG#v}-$target.tar.gz.sha256"
          done
          sha256sum -c ./*.sha256
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
              --notes "One bundle per target, each beside its .sha256. The SDK is @gjermundgaraba/clankerbox-sdk@${TAG#v} on npm."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*.tar.gz ./*.sha256
  publish:
    needs: release
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gjermundgaraba/clankerbox-sdk build
      - name: Pack and check the package
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          pnpm --filter @gjermundgaraba/clankerbox-sdk pack --pack-destination "$RUNNER_TEMP/sdk"
          tar -tzf "$RUNNER_TEMP/sdk/"*.tgz | grep -qx package/LICENSE
          tar -xzOf "$RUNNER_TEMP/sdk/"*.tgz package/package.json | node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const text = readFileSync(0, "utf8");
            assert.doesNotMatch(text, /"(catalog|workspace):/);
            assert.equal(JSON.parse(text).exports["."].import, "./dist/index.mjs");
          '
          git diff --exit-code
      - name: Publish with npm trusted publishing
        run: npm publish "$RUNNER_TEMP/sdk/"*.tgz --access public --provenance --ignore-scripts
