name: Release
# Release tags only, vX.Y.Z, naming the SDK's version, which the CLI and the Sandbox Agent provider
# share. It runs Quality first, then publishes the SDK, the provider and the CLI to npm. Each
# package's npm trusted publisher is bound to this file's name; only the tag trigger gates
# publishing. npm registers a trusted publisher only on a package that exists, so a new package's
# first version is published by hand, with `pnpm publish` from its directory after `npm login`.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions: {}
concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag names the SDK's version, which the provider and the CLI share
        run: |
          test "$GITHUB_REF_NAME" = "v$(jq -r .version packages/sdk/package.json)"
          test "$GITHUB_REF_NAME" = "v$(jq -r .version packages/rivet-sandbox-agent/package.json)"
          test "$GITHUB_REF_NAME" = "v$(jq -r .version apps/clankerbox/package.json)"
  quality:
    needs: tag
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
  publish:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org
      - run: pnpm --filter @gjermundgaraba/clankerbox-sdk --filter @gjermundgaraba/clankerbox-rivet-sandbox-agent --filter @gjermundgaraba/clankerbox build
      - name: Pack and check the package
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          pnpm --filter @gjermundgaraba/clankerbox-sdk pack --pack-destination "$RUNNER_TEMP/sdk"
          tar -tzf "$RUNNER_TEMP/sdk/"*.tgz > "$RUNNER_TEMP/sdk/files"
          grep -qx package/LICENSE "$RUNNER_TEMP/sdk/files"
          grep -qx package/dist/node.mjs "$RUNNER_TEMP/sdk/files"
          tar -xzOf "$RUNNER_TEMP/sdk/"*.tgz package/package.json | node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const text = readFileSync(0, "utf8");
            assert.doesNotMatch(text, /"(catalog|workspace):/);
            const { exports } = JSON.parse(text);
            assert.equal(exports["."].import, "./dist/index.mjs");
            assert.equal(exports["./node"].import, "./dist/node.mjs");
          '
          git diff --exit-code
      - name: Pack and check the provider
        run: |
          mkdir -p "$RUNNER_TEMP/provider"
          pnpm --filter @gjermundgaraba/clankerbox-rivet-sandbox-agent pack --pack-destination "$RUNNER_TEMP/provider"
          tar -tzf "$RUNNER_TEMP/provider/"*.tgz > "$RUNNER_TEMP/provider/files"
          grep -qx package/LICENSE "$RUNNER_TEMP/provider/files"
          grep -qx package/dist/index.mjs "$RUNNER_TEMP/provider/files"
          grep -qx package/recipes/ubuntu/setup.sh "$RUNNER_TEMP/provider/files"
          grep -qx package/recipes/macos/setup.sh "$RUNNER_TEMP/provider/files"
          tar -xzOf "$RUNNER_TEMP/provider/"*.tgz package/package.json | VERSION="${GITHUB_REF_NAME#v}" node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const text = readFileSync(0, "utf8");
            assert.doesNotMatch(text, /"(catalog|workspace):/);
            const { exports, dependencies } = JSON.parse(text);
            assert.equal(exports["."].import, "./dist/index.mjs");
            assert.equal(dependencies["@gjermundgaraba/clankerbox-sdk"], process.env.VERSION);
          '
          git diff --exit-code
      - name: Pack the CLI
        run: pnpm --filter @gjermundgaraba/clankerbox pack --pack-destination "$RUNNER_TEMP/cli"
      # The SDK first: the provider depends on it at the same version. A package whose version npm
      # already has is skipped, so a re-run of a run that published only the SDK finishes it.
      # Outside the checkout: npm refuses to run in a project whose devEngines names pnpm.
      - name: Publish with npm trusted publishing
        working-directory: ${{ runner.temp }}
        run: |
          publish() {
            if npm view "$1@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
              echo "$1@${GITHUB_REF_NAME#v} is already published"
            else
              npm publish "$2"/*.tgz --access public --provenance --ignore-scripts
            fi
          }
          publish @gjermundgaraba/clankerbox-sdk "$RUNNER_TEMP/sdk"
          publish @gjermundgaraba/clankerbox-rivet-sandbox-agent "$RUNNER_TEMP/provider"
          publish @gjermundgaraba/clankerbox "$RUNNER_TEMP/cli"
