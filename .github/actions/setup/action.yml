name: Set up
description: >-
  The Node .node-version pins, the pnpm package.json names, and the workspace's dependencies
  from the lockfile, with no cache. Check out the repository first.
inputs:
  registry-url:
    description: The npm registry setup-node writes an .npmrc for, to publish to; none by default.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        registry-url: ${{ inputs.registry-url }}
        package-manager-cache: false
    - run: npm install -g "$(node -p "require('./package.json').packageManager")"
      shell: bash
    - run: pnpm install --frozen-lockfile
      shell: bash
