syntax = "proto3";
package gate.v1;
option go_package = "clankerbox/spikes/real-local-rpc/gen/gate/v1;gatev1";

// A gate fixture, not a proposed complete product API.
service TerminalProbe {
  rpc Attach(stream AttachmentRequest) returns (stream AttachmentEvent);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
}
message AttachmentRequest {
  oneof command {
    Open open = 1;
    Input input = 2;
    Resize resize = 3;
  }
}
message Open {
  string session_id = 1;
  uint64 resume_offset = 2;
  uint32 snapshot_bytes = 3;
}
message Input { uint64 sequence = 1; bytes data = 2; }
message Resize { uint64 sequence = 1; uint32 columns = 2; uint32 rows = 3; }
message AttachmentEvent {
  oneof event {
    Opened opened = 1;
    SnapshotChunk snapshot_chunk = 2;
    Ack ack = 3;
    Output output = 4;
    Resized resized = 5;
  }
}
message Opened { string session_id = 1; uint64 cut = 2; uint32 snapshot_bytes = 3; }
message SnapshotChunk { uint32 position = 1; bytes data = 2; bool final = 3; }
message Ack { uint64 sequence = 1; bool accepted = 2; }
message Output { uint64 next_offset = 1; bytes data = 2; }
message Resized { uint64 offset = 1; uint32 columns = 2; uint32 rows = 3; }
message GetStatsRequest {}
message GetStatsResponse {
  int64 active = 1;
  uint64 cancelled = 2;
  uint64 slow_readers = 3;
  uint32 queue_capacity = 4;
  uint32 chunk_bytes = 5;
  uint32 max_queued = 6;
}
