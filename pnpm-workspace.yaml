packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer
saveExact: true
catalog:
  "@effect/platform-node": 4.1.7
  "@clanker-stuff/oxlint-config": 0.5.1
  "@effect/tsgo": 0.73.7
  "@effect/vitest": 4.1.7
  "@gjermundgaraba/effect-actions": 0.39.1
  "@types/node": 26.6.6
  effect: 4.1.7
  sandbox-agent: 0.5.7
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
  vitest: 5.1.1
  ultracite: 8.3.0
  xstate: 6.0.0-alpha.73

ignoredOptionalDependencies:
  - "@sandbox-agent/cli"

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    vitest: "*"
  allowAny:
    - vitest
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@gjermundgaraba/*"
  - "@gjermundgaraba-designs/*"
  - "@clanker-stuff/*"
  - effect
  - "@effect/*"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - xstate
  - tsrs
  - "@tsrs/*"
permissions:
  ultracite:
    skills: true
skills:
  dirs:
    - .agents/skills
    - .claude/skills
