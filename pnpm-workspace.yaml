packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer
saveExact: true
catalog:
  "@effect/platform-node": 4.1.1
  # The CLI, the server and the host depend on it directly, with no import, at effect's
  # version, for npm installs: platform-node takes it by caret, and a newer one requires a newer
  # effect, so npm would install a second effect under it. Keep it equal to effect.
  "@effect/platform-node-shared": 4.1.1
  "@clanker-stuff/oxlint-config": 0.2.1
  "@effect/tsgo": 0.63.0
  "@effect/vitest": 4.1.1
  "@gjermundgaraba/effect-actions": 0.26.1
  "@types/node": 26.6.6
  effect: 4.1.1
  sandbox-agent: 0.5.4
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  ultracite: 8.1.0
  oxfmt: 0.74.0
  xstate: 6.0.0-alpha.71

ignoredOptionalDependencies:
  - "@sandbox-agent/cli"

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@gjermundgaraba/*"
  - "@gjermundgaraba-designs/*"
  - "@clanker-stuff/*"
  - effect
  - "@effect/*"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - xstate
permissions:
  ultracite:
    skills: true
skills:
  dirs:
    - .agents/skills
    - .claude/skills
