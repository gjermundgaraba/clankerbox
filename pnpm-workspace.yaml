packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer
catalog:
  "@effect/platform-node": 4.0.4
  "@effect/vitest": 4.0.4
  "@gjermundgaraba/effect-actions": 0.17.0
  "@types/node": 26.6.4
  effect: 4.0.4
  sandbox-agent: 0.5.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
  xstate: 6.0.0-alpha.66
  "@xstate/effect": 0.1.0-alpha.7

# The provider talks to a Sandbox Agent in a guest, so the SDK's own server binary stays out.
ignoredOptionalDependencies:
  - "@sandbox-agent/cli"

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest
# Registry releases wait one day unless explicitly approved below.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@gjermundgaraba/effect-actions"
  - effect
  - "@effect/*"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - xstate
  - "@xstate/*"
