packages:
  - apps/*
  - packages/*
  - tools/*
  - tests/*

catalogMode: prefer
catalog:
  "@effect/platform-node": 4.0.2
  "@gjermundgaraba/effect-actions": 0.11.0
  "@types/node": 26.6.4
  effect: 4.0.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
  allowAny:
    - vite
# Registry releases wait one day unless explicitly approved below.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@gjermundgaraba/effect-actions"
  - effect@4.0.2
  - "@effect/platform-node@4.0.2"
  - "@effect/platform-node-shared@4.0.2"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
