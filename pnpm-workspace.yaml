packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer
saveExact: true
catalog:
  "@effect/platform-node": 4.0.6
  # The CLI depends on it directly, at effect's version, for npm installs: platform-node takes
  # it by caret, and a newer one requires a newer effect, so npm would install a second effect
  # under it. Keep it equal to effect.
  "@effect/platform-node-shared": 4.0.6
  "@clanker-stuff/oxlint-config": 0.1.0
  "@effect/tsgo": 0.57.0
  "@effect/vitest": 4.0.6
  "@gjermundgaraba/effect-actions": 0.21.0
  "@types/node": 26.6.5
  effect: 4.0.6
  sandbox-agent: 0.5.3
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: 5.0.5
  xstate: 6.0.0-alpha.70
  "@xstate/effect": 1.0.0-alpha.9
  ultracite: 8.0.2
  oxlint: 1.89.0
  oxfmt: 0.74.0

ignoredOptionalDependencies:
  - "@sandbox-agent/cli"

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@gjermundgaraba/*"
  - "@gjermundgaraba-designs/*"
  - "@clanker-stuff/*"
  - effect
  - "@effect/*"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - xstate
  - "@xstate/*"
permissions:
  ultracite:
    skills: true
skills:
  dirs:
    - .agents/skills
    - .claude/skills
