packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer
saveExact: true
catalog:
  "@effect/platform-node": 4.1.3
  "@clanker-stuff/oxlint-config": 0.5.0
  "@effect/tsgo": 0.67.7
  "@effect/vitest": 4.1.3
  "@gjermundgaraba/effect-actions": 0.31.0
  "@types/node": 26.6.6
  effect: 4.1.3
  sandbox-agent: 0.5.4
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  vitest: 5.1.0
  ultracite: 8.1.1
  xstate: 6.0.0-alpha.73

ignoredOptionalDependencies:
  - "@sandbox-agent/cli"

overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@gjermundgaraba/*"
  - "@gjermundgaraba-designs/*"
  - "@clanker-stuff/*"
  - effect
  - "@effect/*"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - xstate
permissions:
  ultracite:
    skills: true
skills:
  dirs:
    - .agents/skills
    - .claude/skills
